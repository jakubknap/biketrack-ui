<div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" (click)="close()"></div>
    <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-2xl p-6 z-50 max-h-[90vh] overflow-y-auto mx-4 sm:mx-auto" #modalContent>

        <button type="button" (click)="close()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
            ✕
        </button>

        <h3 class="text-xl font-semibold text-gray-800 mb-4">
            Dodaj nową naprawę
        </h3>
        
        <div *ngIf="errorMessage" class="relative mb-6 p-4 rounded-lg border text-sm font-medium shadow-sm bg-red-50 border-red-200 text-red-800">
            <span>
                {{ errorMessage }}
            </span>
            <button type="button" (click)="errorMessage = null" class="absolute top-2 right-2 text-lg leading-none cursor-pointer hover:opacity-75">
                &times;
            </button>
        </div>
        
        <form [formGroup]="addRepairForm" (ngSubmit)="onSubmit()" novalidate class="space-y-4">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
                    Tytuł
                </label>
                <input id="title" formControlName="title" type="text" class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                <div *ngIf="title.errors && (title.dirty || title.touched)" class="mt-1 text-sm text-red-600 space-y-1 break-words">
                    <div *ngIf="title.errors['required']">Tytuł jest wymagany</div>
                    <div *ngIf="title.errors['pattern']">Tytuł zawiera niedozwolone znaki</div>
                    <div *ngIf="title.errors['backend']">{{ title.errors['backend'] }}</div>
                </div>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
                    Opis
                </label>
                <textarea id="description" formControlName="description" class="w-full border rounded-md px-3 py-2 min-h-[65px] resize-y focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                <div *ngIf="description.errors && (description.dirty || description.touched)" class="mt-1 text-sm text-red-600 space-y-1 break-words">
                    <div *ngIf="description.errors['pattern']">Opis zawiera niedozwolone znaki</div>
                    <div *ngIf="description.errors['backend']">{{ description.errors['backend'] }}</div>
                </div>
            </div>

            <div>
                <label for="cost" class="block text-sm font-medium text-gray-700 mb-1">
                    Koszt
                </label>
                <input id="cost" formControlName="cost" type="number" class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                <div *ngIf="cost.errors && (cost.dirty || cost.touched)" class="mt-1 text-sm text-red-600 space-y-1 break-words">
                    <div *ngIf="cost.errors['backend']">{{ cost.errors['backend'] }}</div>
                </div>
            </div>

            <div>
                <label for="currency" class="block text-sm font-medium text-gray-700 mb-1">
                    Waluta
                </label>
                <input id="currency" formControlName="currency" type="text" class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                <div *ngIf="currency.errors && (currency.dirty || currency.touched)" class="mt-1 text-sm text-red-600 space-y-1 break-words">
                    <div *ngIf="currency.errors['backend']">{{ currency.errors['backend'] }}</div>
                </div>
            </div>

            <div>
                <label for="repairDate" class="block text-sm font-medium text-gray-700 mb-1">
                    Data naprawy
                </label>
                <input id="repairDate" formControlName="repairDate" type="date" class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <div class="flex justify-center gap-4 mt-4">
                <button type="button" (click)="close()" class="px-6 py-2 rounded-md border">
                    Anuluj
                </button>

                <button type="submit" [disabled]="loading" class="px-6 py-2 flex items-center justify-center bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors font-medium">
                    <app-spinner *ngIf="loading"></app-spinner>
                    <span>
                        {{ loading ? 'Przetwarzanie...' : 'Dodaj' }}
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
