<div class="min-h-screen bg-gradient-to-b from-blue-50 to-white flex flex-col">

    <app-basic-header></app-basic-header>

    <main class="flex-grow flex items-center justify-center px-4 mb-6 sm:mb-8">
        <div class="w-full max-w-lg mt-6 sm:mt-8">

            <div *ngIf="responseStatus && responseMessage" class="relative mb-6 p-4 rounded-lg border text-sm font-medium shadow-sm" [ngClass]="{'bg-green-50 border-green-200 text-green-800': responseStatus === 'success', 'bg-red-50 border-red-200 text-red-800': responseStatus === 'error'}">
                <span>
                    {{ responseMessage }}
                </span>
                <button type="button" (click)="responseMessage = null" class="absolute top-2 right-2 text-lg leading-none cursor-pointer hover:opacity-75">
                    &times;
                </button>
            </div>

            <div class="bg-white shadow-xl rounded-xl p-8">
                <h2 class="text-2xl sm:text-3xl font-bold mb-3 text-gray-800 text-center break-words px-2">
                    Zresetuj hasło
                </h2>
                <p class="text-sm text-gray-600 text-center mb-8">
                    Wprowadź adres e-mail powiązany z Twoim kontem, a my wyślemy Ci link do resetowania hasła.
                </p>

                <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            E-mail
                        </label>
                        <input id="email" formControlName="email" autocomplete="email" type="email" class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" EmptyToNull/>
                        <div *ngIf="email.errors && (email.dirty || email.touched)" class="mt-1 text-sm text-red-600 space-y-1 break-words">
                            <div *ngIf="email.errors['required']">E-mail jest wymagany</div>
                            <div *ngIf="email.errors['maxlength']">Email musi mieć max. 128 znaków</div>
                            <div *ngIf="email.errors['email']">Wprowadź poprawny adres email</div>
                            <div *ngIf="email.errors['backend']">{{ email.errors['backend'] }}</div>
                        </div>
                    </div>

                    <button type="submit" [disabled]="loading" class="w-full flex items-center justify-center bg-blue-600 text-white py-2.5 rounded-md hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors font-medium">
                        <app-spinner *ngIf="loading"></app-spinner>
                        <span>
                            {{ loading ? 'Przetwarzanie...' : 'Resetuj hasło' }}
                        </span>
                    </button>

                    <div class="flex items-center justify-center mt-4 space-x-2">
                        <a routerLink="/login" class="bg-blue-100 text-blue-700 text-sm font-medium py-1.5 px-4 rounded-md hover:bg-blue-200 transition-colors">
                            Wróć do logowania
                        </a>
                    </div>

                    <div class="flex items-center justify-center mt-4 space-x-2">
                        <a routerLink="/" class="text-sm text-gray-600">
                            ← Wróć na stronę główną
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <app-footer></app-footer>

</div>
