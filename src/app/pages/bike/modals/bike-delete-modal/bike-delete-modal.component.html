<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" (click)="close()"></div>

  <div *ngIf="errorMessage" class="relative bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 z-50 max-h-[90vh] overflow-y-auto mx-4 sm:mx-auto">
    <div class="flex flex-col items-center text-center gap-4">
      <svg class="w-12 h-12 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9z" />
      </svg>

      <p class="text-red-700 text-sm">{{ errorMessage }}</p>

      <button (click)="delete()" class="bg-red-100 text-red-700 px-4 py-2 rounded-lg hover:bg-red-200 transition font-medium" [disabled]="loading">
        <span *ngIf="loading">Przetwarzanie...</span>
        <span *ngIf="!loading">Spróbuj ponownie</span>
      </button>

      <button (click)="close()" class="text-gray-500 hover:text-gray-700 text-sm mt-2">
        Zamknij
      </button>
    </div>
  </div>

  <div *ngIf="!errorMessage" class="relative bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 z-50 max-h-[90vh] overflow-y-auto mx-4 sm:mx-auto">

    <h3 class="text-lg font-semibold text-gray-800 mb-4">Potwierdź usunięcie</h3>

    <p class="text-gray-600 mb-6">
      Czy na pewno chcesz usunąć rower <strong>{{ bikeDto.name }}</strong>?
    </p>

    <div class="flex justify-center gap-4">
      <button type="button" (click)="close()" class="px-6 py-2 rounded-md border">Anuluj</button>
      <button type="button" (click)="delete()" class="px-6 py-2 flex items-center justify-center bg-red-600 text-white rounded-md hover:bg-red-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors font-medium" [disabled]="loading">
        <app-spinner *ngIf="loading"></app-spinner>
        {{ loading ? 'Przetwarzanie...' : 'Usuń' }}
      </button>
    </div>
  </div>
</div>
